  WH_Staging.map.Pricing:
    description: "Pricing table"
    columns:
      ContractYear: { data_type: nvarchar, nullable: true }
      CA: { data_type: nvarchar, nullable: true }
      Standardised_Test_Description: { data_type: nvarchar, nullable: true }
