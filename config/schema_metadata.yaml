maps:

  WH_Staging.map.KPI:
    description: "Contractual KPI mapping table"
    columns:
      TrustSite: { data_type: nvarchar, nullable: true }
      Service_Level_Number: { data_type: float, nullable: true }
      Service_Level_Name: { data_type: nvarchar, nullable: true }
      Test_Code: { data_type: nvarchar, nullable: true }
      Source_Type: { data_type: nvarchar, nullable: true }
      Urgency_Code: { data_type: nvarchar, nullable: true }
      TAT_Target: { data_type: nvarchar, nullable: true }
      TAT_Target_Value: { data_type: float, nullable: true }

  WH_Staging.map.Locations:
    description: "Location mapping table"
    columns:
      LocationCode: { data_type: nvarchar, nullable: true }
      LocationName: { data_type: nvarchar, nullable: true }
      Address: { data_type: nvarchar, nullable: true }
      Address2: { data_type: nvarchar, nullable: true }
