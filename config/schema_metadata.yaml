relationships:
  WH_Staging.CombinedData:
    joins:
      WH_Staging.map.Locations: LocationCode
      WH_Staging.map.TestCodes: Test_Code

  WH_Staging.BHI_BT_MB_Calc:
    joins:
      WH_Staging.map.TestCodes: TestCode
      WH_Staging.map.Locations: SourceCode

  WH_Staging.vw_CombinedKPI_SK:
    joins:
      WH_Staging.map.KPI: Test_Code_KPI
      WH_Staging.map.TestCodes: TestCode
      WH_Staging.map.Locations: Source_Location

mappings:
  calc_to_combineddata:
    System: SourceSystem
    SourceCode: LocationCode
    SourceName: LocationName

mandatory_filters:
  QCIndicator: "I"
  CancelledIndicator: "I"
  Is_Distinct: 1

month_fields:
  - ResultAuthDateMonthYear
  - FileMonthYear
  - ReceivedDateTime
  - SampleDateTime
  - ResultAuthDateTime